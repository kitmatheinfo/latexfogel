[package]
name = "latexfogel"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "deprecated"] }
env_logger = "0.11.11"
fontdb = "0.24.0"
image = "0.25.10"
log = "0.4.34"
poise = "0.7.0"
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls",
    "query",
] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
typst = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
typst-render = "0.15.1"
